name: Sync post

on:
  discussion:
    types:
      - created
      - edited
      - deleted
  discussion_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      discussions: read
    steps:
      - run: ${{ github.event.discussion.category.name == 'Posts' && github.event.discussion.user.login == github.repository_owner }}

  discussion:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: read
    env:
      ID: ${{ github.event.discussion.node_id }}
      ACTION: ${{ github.event.action }}
    steps:
      - uses: actions/checkout@v6

      - name: Print full data
        run: echo "${{ toJSON(github.event.discussion) }}"
        continue-on-error: true

      - run: |
          pwd
          ls -lha
      - name: Build json
        id: build-json
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const json = {
              title: '${{ github.event.discussion.title }}',
              createdAt: '${{ github.event.discussion.created_at }}',
              updatedAt: '${{ github.event.discussion.updated_at }}',
              description: '${{ github.event.discussion.body }}',
              postCount: ${{ github.event.discussion.comments }},
              posts: [
                {
                  createdAt: '${{ github.event.comment.created_at }}',
                  updatedAt: '${{ github.event.comment.updated_at }}',
                  body: '${{ github.event.comment.body }}',
                }
              ]
            }

            return JSON.stringify(json)
      - name: Make json file
        run: |
          JSON='${{ steps.build-json.outputs.result }}'
          cat > "${ID}.json" <<EOF
          ${JSON}
          EOF
      - run: |
          ls -lha
          cat "${ID}.json" >> "$GITHUB_STEP_SUMMARY"

